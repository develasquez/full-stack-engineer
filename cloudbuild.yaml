# ==============================================================================
# Google Cloud Build Pipeline - Tiendas D1 (GitOps & DevSecOps 2026)
# Concurrencia controlada con 'waitFor' y Escaneo de Vulnerabilidades con Trivy
# ==============================================================================

steps:
  # ----------------------------------------------------------------------------
  # Paso 1: Pruebas Unitarias y Calidad de Código en Backend (Node.js 20)
  # ----------------------------------------------------------------------------
  - id: 'test-backend'
    name: 'node:20-alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        cd backend
        npm ci
        npm test
    waitFor: ['-'] # Inicia inmediatamente en paralelo

  # ----------------------------------------------------------------------------
  # Paso 2: Construcción de Imagen Docker Backend
  # ----------------------------------------------------------------------------
  - id: 'build-backend'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/d1-backend:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/d1-backend:latest'
      - './backend'
    waitFor: ['test-backend']

  # ----------------------------------------------------------------------------
  # Paso 3: Construcción de Imagen Docker Frontend (Vanilla-Core UI)
  # ----------------------------------------------------------------------------
  - id: 'build-frontend'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/d1-frontend:$SHORT_SHA'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/d1-frontend:latest'
      - './frontend'
    waitFor: ['-'] # Construye en paralelo mientras corre el test de backend

  # ----------------------------------------------------------------------------
  # Paso 4: Escaneo de Vulnerabilidades en Imagen Backend con Trivy
  # https://trivy.dev/docs/latest/getting-started/
  # ----------------------------------------------------------------------------
  - id: 'scan-backend-trivy'
    name: 'aquasec/trivy:latest'
    args:
      - 'image'
      - '--severity'
      - 'HIGH,CRITICAL'
      - '--exit-code'
      - '0' # Permite visualización pedagógica en logs de Cloud Build
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/d1-backend:$SHORT_SHA'
    waitFor: ['build-backend']

  # ----------------------------------------------------------------------------
  # Paso 5: Escaneo de Vulnerabilidades en Imagen Frontend con Trivy
  # ----------------------------------------------------------------------------
  - id: 'scan-frontend-trivy'
    name: 'aquasec/trivy:latest'
    args:
      - 'image'
      - '--severity'
      - 'HIGH,CRITICAL'
      - '--exit-code'
      - '0'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/d1-frontend:$SHORT_SHA'
    waitFor: ['build-frontend']

  # ----------------------------------------------------------------------------
  # Paso 6: Publicación de Imágenes en Artifact Registry
  # ----------------------------------------------------------------------------
  - id: 'push-backend'
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/d1-backend:$SHORT_SHA']
    waitFor: ['scan-backend-trivy']

  - id: 'push-backend-latest'
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/d1-backend:latest']
    waitFor: ['push-backend']

  - id: 'push-frontend'
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/d1-frontend:$SHORT_SHA']
    waitFor: ['scan-frontend-trivy']

  - id: 'push-frontend-latest'
    name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/d1-frontend:latest']
    waitFor: ['push-frontend']

  # ----------------------------------------------------------------------------
  # Paso 7: Preparación e Inyección Dinámica de Manifiestos K8s
  # ----------------------------------------------------------------------------
  - id: 'prepare-k8s-manifests'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "🔧 Reemplazando PROJECT_ID y SHA en manifiestos K8s..."
        sed -i "s|PROJECT_ID_PLACEHOLDER|$PROJECT_ID|g" k8s/backend-deployment.yaml
        sed -i "s|PROJECT_ID_PLACEHOLDER|$PROJECT_ID|g" k8s/frontend-deployment.yaml
        sed -i "s|:latest|:$SHORT_SHA|g" k8s/backend-deployment.yaml
        sed -i "s|:latest|:$SHORT_SHA|g" k8s/frontend-deployment.yaml
        cat k8s/backend-deployment.yaml | grep "image:"
    waitFor: ['push-backend-latest', 'push-frontend-latest']

  # ----------------------------------------------------------------------------
  # Paso 8: Despliegue GitOps en Google Kubernetes Engine (GKE Private Cluster)
  # ----------------------------------------------------------------------------
  - id: 'deploy-to-gke'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "🚀 Conectando al clúster GKE ${_CLUSTER_NAME} en ${_CLUSTER_LOCATION}..."
        gcloud container clusters get-credentials ${_CLUSTER_NAME} --zone ${_CLUSTER_LOCATION} --project $PROJECT_ID
        
        echo "📦 Aplicando Manifiestos Declarativos GitOps..."
        kubectl apply -f k8s/namespace.yaml
        kubectl apply -f k8s/configmap.yaml
        kubectl apply -f k8s/secret.yaml
        kubectl apply -f k8s/backend-deployment.yaml
        kubectl apply -f k8s/backend-service.yaml
        kubectl apply -f k8s/frontend-deployment.yaml
        kubectl apply -f k8s/frontend-service.yaml
        kubectl apply -f k8s/ingress.yaml
        kubectl apply -f k8s/hpa.yaml
        
        echo "⏳ Esperando despliegue de pods..."
        kubectl rollout status deployment/d1-backend -n tiendas-d1 --timeout=120s
        kubectl rollout status deployment/d1-frontend -n tiendas-d1 --timeout=120s
        
        echo "✅ Despliegue GitOps en GKE finalizado exitosamente."
    waitFor: ['prepare-k8s-manifests']

# Variables sustituibles configurables en el Cloud Build Trigger
substitutions:
  _CLUSTER_NAME: 'd1-private-cluster'
  _CLUSTER_LOCATION: 'us-central1-a'
  _REPO_NAME: 'd1-docker-repo'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
