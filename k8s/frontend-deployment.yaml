apiVersion: apps/v1
kind: Deployment
metadata:
  name: d1-frontend
  namespace: tiendas-d1
  labels:
    app.kubernetes.io/name: d1-frontend
    app.kubernetes.io/part-of: tiendas-d1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: d1-frontend
  template:
    metadata:
      labels:
        app: d1-frontend
    spec:
      containers:
        - name: frontend
          image: us-central1-docker.pkg.dev/PROJECT_ID_PLACEHOLDER/d1-docker-repo/d1-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
