apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-frontend
  namespace: retail-store
  labels:
    app: retail-frontend
    app.kubernetes.io/name: retail-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: retail-platform-2026
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retail-frontend
  template:
    metadata:
      labels:
        app: retail-frontend
        app.kubernetes.io/name: retail-frontend
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: frontend
          image: us-central1-docker.pkg.dev/retail-enterprise-2026/retail-docker-repo/retail-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          env:
            - name: PORT
              value: "80"
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
