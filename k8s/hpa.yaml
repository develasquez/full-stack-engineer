apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: d1-backend-hpa
  namespace: tiendas-d1
  labels:
    app.kubernetes.io/name: d1-backend-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: d1-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
