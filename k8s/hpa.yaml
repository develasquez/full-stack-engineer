apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: retail-backend-hpa
  namespace: retail-store
  labels:
    app: retail-backend
    app.kubernetes.io/name: retail-backend-hpa
    app.kubernetes.io/part-of: retail-platform-2026
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: retail-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
