apiVersion: apps/v1
kind: Deployment
metadata:
  name: d1-backend
  namespace: tiendas-d1
  labels:
    app.kubernetes.io/name: d1-backend
    app.kubernetes.io/part-of: tiendas-d1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: d1-backend
  template:
    metadata:
      labels:
        app: d1-backend
    spec:
      containers:
        - name: backend
          image: us-central1-docker.pkg.dev/PROJECT_ID_PLACEHOLDER/d1-docker-repo/d1-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: tiendas-d1-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tiendas-d1-secrets
                  key: DB_PASSWORD
            - name: API_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: tiendas-d1-secrets
                  key: API_SIGNING_KEY
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
