apiVersion: apps/v1
kind: Deployment
metadata:
  name: retail-backend
  namespace: retail-store
  labels:
    app: retail-backend
    app.kubernetes.io/name: retail-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: retail-platform-2026
spec:
  replicas: 2
  selector:
    matchLabels:
      app: retail-backend
  template:
    metadata:
      labels:
        app: retail-backend
        app.kubernetes.io/name: retail-backend
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: us-central1-docker.pkg.dev/retail-enterprise-2026/retail-docker-repo/retail-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: retail-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: retail-secret
                  key: DATABASE_URL
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: retail-secret
                  key: API_KEY
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 2
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
